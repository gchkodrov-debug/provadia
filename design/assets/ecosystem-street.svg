<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">The family street, unbuilt</title><desc id="desc">A long stone street between empty plots edged by low masonry. One warm light falls from the upper left. No houses, signs, people, coins or activity.</desc>
<defs>
 <radialGradient id="air" cx=".17" cy="0" r=".86"><stop stop-color="#6B4A12" stop-opacity=".38"/><stop offset=".58" stop-color="#141210"/><stop offset="1" stop-color="#141210"/></radialGradient>
 <linearGradient id="road" x1=".1" y1="0" x2=".6" y2="1"><stop stop-color="#6B4A12" stop-opacity=".18"/><stop offset=".58" stop-color="#3D2A08" stop-opacity=".42"/><stop offset="1" stop-color="#141210"/></linearGradient>
 <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFEFC1" stop-opacity=".32"/><stop offset=".4" stop-color="#C9A227" stop-opacity=".27"/><stop offset="1" stop-color="#6B4A12" stop-opacity=".3"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6B4A12" stop-opacity=".58"/><stop offset="1" stop-color="#141210"/></linearGradient>
 <radialGradient id="pool" cx=".18" cy=".16" r=".83"><stop stop-color="#FFEFC1" stop-opacity=".12"/><stop offset="1" stop-color="#C9A227" stop-opacity="0"/></radialGradient>
 <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset=".65" stop-color="#141210" stop-opacity="0"/><stop offset="1" stop-color="#141210"/></linearGradient>
</defs>
<path fill="url(#air)" d="M0 0H1600V880H0z"/>
<!-- The distant wall belongs to the town, not to a built house. -->
<g fill="#141210" stroke="#6B4A12" stroke-opacity=".26"><path d="M0 218L316 168 618 194 812 174 1080 197 1370 168 1600 198V350H0Z"/><path d="M0 241L316 191 618 215 812 197 1080 220 1370 193 1600 224" fill="none"/></g>
<path fill="url(#road)" d="M726 220H874L1550 880H50Z"/>
<!-- Low empty plot boundaries: caps catch the same upper-left aperture. -->
<g stroke="#6B4A12" stroke-width="1">
 <path fill="url(#wall)" d="M0 640L631 300V340L0 739Z"/><path fill="url(#cap)" d="M0 626L621 285 648 297 0 658Z"/>
 <path fill="url(#wall)" d="M0 416L678 260V280L0 461Z"/><path fill="url(#cap)" d="M0 406L667 251 689 258 0 427Z"/>
 <path fill="url(#wall)" d="M275 245L709 232V245L286 266Z"/><path fill="url(#cap)" d="M267 238L702 226 718 232 281 251Z"/>
 <path fill="url(#wall)" d="M1600 640L969 300V340L1600 739Z"/><path fill="url(#cap)" d="M1600 626L979 285 952 297 1600 658Z"/>
 <path fill="url(#wall)" d="M1600 416L922 260V280L1600 461Z"/><path fill="url(#cap)" d="M1600 406L933 251 911 258 1600 427Z"/>
 <path fill="url(#wall)" d="M1325 245L891 232V245L1314 266Z"/><path fill="url(#cap)" d="M1333 238L898 226 882 232 1319 251Z"/>
</g>
<!-- Empty ground enclosed by the low cross-walls; no roof, facade or identity. -->
<g fill="#141210" stroke="#6B4A12" stroke-opacity=".6">
 <path d="M0 470L418 341 465 400 0 634Z"/><path d="M0 469L418 341 427 357 0 489Z" fill="url(#cap)"/>
 <path d="M307 268L575 260 605 297 450 349Z"/><path d="M307 268L575 260 579 269 316 279Z" fill="url(#cap)"/>
 <path d="M1600 470L1182 341 1135 400 1600 634Z"/><path d="M1600 469L1182 341 1173 357 1600 489Z" fill="url(#cap)"/>
 <path d="M1293 268L1025 260 995 297 1150 349Z"/><path d="M1293 268L1025 260 1021 269 1284 279Z" fill="url(#cap)"/>
</g>
<!-- Road laid in perspective; irregular joints are material, not record marks. -->
<g fill="none" stroke="#C9A227" stroke-opacity=".16">
 <path d="M726 220L50 880M750 220L350 880M777 220L650 880M823 220L950 880M850 220L1250 880M874 220L1550 880"/>
